<svg width="585" height="646" viewBox="0 0 585 646" fill="none" xmlns="http://www.w3.org/2000/svg">
<mask id="gearMask" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="585" height="646">
  <!-- Center solid area -->
  <circle cx="292.5" cy="323" r="240" fill="white"/>
  
  <!-- Gear Teeth -->
  <g fill="white" transform="translate(292.5, 323)">
    <!-- 12 teeth generated by 6 rotated rectangles -->
    <rect x="-40" y="-280" width="80" height="560" rx="15" />
    <rect x="-40" y="-280" width="80" height="560" rx="15" transform="rotate(30)" />
    <rect x="-40" y="-280" width="80" height="560" rx="15" transform="rotate(60)" />
    <rect x="-40" y="-280" width="80" height="560" rx="15" transform="rotate(90)" />
    <rect x="-40" y="-280" width="80" height="560" rx="15" transform="rotate(120)" />
    <rect x="-40" y="-280" width="80" height="560" rx="15" transform="rotate(150)" />
  </g>
</mask>
<rect x="0" y="0" width="585" height="646" fill="black" mask="url(#gearMask)"/>
</svg>
